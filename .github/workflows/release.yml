# Builds the Windows installers, signs them for the in-app updater, and
# publishes them as a GitHub Release.
#
# Release: bump the version, then push an annotated tag. The tag message
# becomes the release notes shown in the app's update dialog:
#   git tag -a v0.2.0 -m "Reclaim 0.2.0" -m "- What changed"
#   git push origin v0.2.0
#
# Dry run: start this workflow manually from main. It builds and signs but
# publishes nothing.
#
# Each job gets only what it needs. The build job runs third-party code
# (npm packages, crate build scripts) with a read-only token and no
# secrets. The updater signing key lives in the `release` environment,
# which only v* tags and main can use, and only the sign job reads it. The
# publish job, the only one that can write to the repo, runs nothing but
# GitHub's own tooling. Every action is pinned to a commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build installers
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in tauri.conf.json ($version)."
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build

      - name: Collect release files
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir release-files
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release-files/
          cp src-tauri/target/release/bundle/msi/*.msi release-files/
          cp src-tauri/target/release/reclaim.exe "release-files/Reclaim_${version}_x64_portable.exe"
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  sign:
    name: Sign updates
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Locked and integrity-checked; pnpm doesn't run dependency install scripts.
      - name: Install the Tauri CLI
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - name: Read release notes from the tag
        run: |
          mkdir -p release-notes
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # actions/checkout drops annotated tag messages, so fetch the tag itself.
            git fetch --no-tags --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > release-notes/notes.md
          else
            echo "Dry run from $GITHUB_REF_NAME." > release-notes/notes.md
          fi
          cat release-notes/notes.md

      - name: Sign installers and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for f in release-files/*-setup.exe release-files/*.msi; do
            # --app-version puts the version inside the signature, which the
            # app requires (requireSignedVersion) so a tampered manifest can't
            # pass an older release off as a newer one.
            pnpm tauri signer sign --app-version "$version" "$f" > /dev/null
            echo "Signed $f"
          done
          node .github/scripts/update-manifest.mjs release-files "$version" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version" release-notes/notes.md
          mkdir update-files
          mv release-files/*.sig release-files/latest.json update-files/
          cat update-files/latest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-files
          path: update-files/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/

  publish:
    name: Publish release
    needs: [build, sign]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-files
          path: release-files

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp release-notes/notes.md notes.md
          cat >> notes.md <<'EOF'

          ## Download

          | File | What it is |
          | --- | --- |
          | **…_x64-setup.exe** | Installer. Start here if you're not sure. |
          | **…_x64_en-US.msi** | MSI installer, for managed or scripted installs. |
          | **…_x64_portable.exe** | Portable app. Runs without installing. |
          | **SHA256SUMS.txt** | Checksums for verifying the downloads. |

          The `latest.json` and `.sig` files are used by Reclaim's built-in updater; you don't need to download them.

          Requires 64-bit Windows 10 or 11. If you already have Reclaim 0.2.0 or later installed, it offers this update by itself.

          Reclaim isn't code-signed yet, so Windows SmartScreen may show "Windows protected your PC". Select **More info**, then **Run anyway**.
          EOF
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Reclaim $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
