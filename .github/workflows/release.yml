# Builds the Windows installers and publishes them as a GitHub Release.
# Triggered by pushing a version tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
#
# The build job runs third-party code (npm packages, crate build scripts)
# with a read-only token. Only the small publish job, which runs nothing
# but GitHub's own tooling, can write to the repository. Every action is
# pinned to a commit; Dependabot keeps the pins current.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build installers
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in tauri.conf.json ($version)."
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build

      - name: Collect release files
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release-files
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release-files/
          cp src-tauri/target/release/bundle/msi/*.msi release-files/
          cp src-tauri/target/release/reclaim.exe "release-files/Reclaim_${version}_x64_portable.exe"
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Download

          | File | What it is |
          | --- | --- |
          | **…_x64-setup.exe** | Installer. Start here if you're not sure. |
          | **…_x64_en-US.msi** | MSI installer, for managed or scripted installs. |
          | **…_x64_portable.exe** | Portable app. Runs without installing. |
          | **SHA256SUMS.txt** | Checksums for verifying the downloads. |

          Requires 64-bit Windows 10 or 11.

          Reclaim isn't code-signed yet, so Windows SmartScreen may show "Windows protected your PC". Select **More info**, then **Run anyway**.
          EOF
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Reclaim $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
